<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MentorIA Shield — MVP</title>
<meta name="theme-color" content="#173b99">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#65708a;--primary:#2557d6;--primary2:#173b99;--ok:#16834b;--warn:#b56a00;--danger:#b42318;--line:#dfe4ee}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.app{max-width:520px;margin:auto;min-height:100vh}.top{background:#173b99;color:white;padding:24px 20px 22px;border-radius:0 0 24px 24px}
.logo{font-weight:800;font-size:25px}.sub{opacity:.9;margin-top:5px}.content{padding:18px}
.card{background:#fff;border:1px solid #dfe4ee;border-radius:18px;padding:18px;margin-bottom:14px}
h1,h2,h3{margin:0 0 10px} p{line-height:1.5}.muted{color:#65708a}
button{width:100%;border:0;border-radius:13px;padding:14px 15px;margin-top:9px;font-size:16px;font-weight:700;cursor:pointer;background:#2557d6;color:#fff}
button.secondary{background:#eef2ff;color:#173b99} button.light{background:#f2f4f8;color:#172033}
.option{text-align:left;background:#fff;color:#172033;border:1px solid #dfe4ee;font-weight:600}
.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#eef2ff;color:#173b99;font-size:12px;font-weight:700}
.progress{height:9px;background:#e7eaf0;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#2557d6;width:0}
.result{font-size:34px;font-weight:800;margin:5px 0}.ok{color:#16834b}.warn{color:#b56a00}
.nav{position:-webkit-sticky;position:sticky;bottom:0;background:#fff;border-top:1px solid #dfe4ee;padding:10px;display:flex;gap:7px}.nav button{margin:0;padding:11px 5px;font-size:12px;background:#f0f2f7;color:#25304a}.nav button.active{background:#e9efff;color:#173b99}
.small{font-size:13px}.pill{display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;-webkit-box-align:center;align-items:center;gap:10px}
textarea,input{width:100%;padding:12px;border:1px solid #dfe4ee;border-radius:12px;font-size:16px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">MentorIA</div><div class="sub">Educacao - Protecao - Futuro</div></header>
<main class="content" id="app"></main>
<nav class="nav"><button id="nHome" onclick="home()">Inicio</button><button id="nShield" onclick="shield()">Shield</button><button id="nTest" onclick="startTest('before')">Teste</button><button id="nChat" onclick="chat()">MentorIA</button><button id="nFuturo" onclick="futuro()">Futuro</button></nav>
</div>
<script>
var questions=[
{q:"Uma pessoa oferece dinheiro para voce trabalhar depois da escola e pede para nao contar aos seus pais. O que voce faria?",a:["Aceitaria porque e uma oportunidade.","Nao contaria para ninguem.","Conversaria com um adulto de confianca e buscaria orientacao.","Aceitaria se o pagamento fosse bom."],c:2,e:"Uma oferta que pede segredo ou pode colocar voce em risco merece atencao. Converse com um adulto de confianca e busque orientacao."},
{q:"Uma atividade faz voce faltar a escola e ficar muito cansado. O que e mais seguro fazer?",a:["Continuar porque e importante ajudar.","Esconder as faltas.","Conversar com um adulto de confianca e buscar ajuda.","Aceitar se a atividade pagar bem."],c:2,e:"A escola, a saude, o descanso e a convivencia familiar sao importantes. Situacoes que os prejudicam precisam ser discutidas com um adulto de confianca."},
{q:"Uma pessoa na internet promete dinheiro facil, pede seus dados pessoais e diz para voce manter segredo. Qual e o principal sinal de alerta?",a:["O dinheiro facil.","O uso da internet.","O pedido de dados e segredo.","Nenhum, se a pessoa parecer simpatica."],c:2,e:"Pedidos de dados pessoais, segredo e promessas de dinheiro facil podem indicar uma situacao de risco. Nao compartilhe dados e procure um adulto de confianca."},
{q:"Voce suspeita que uma crianca esta sendo explorada pelo trabalho. Qual atitude e mais adequada?",a:["Investigar sozinho.","Confrontar a pessoa responsavel.","Ignorar para nao se envolver.","Procurar um adulto de confianca e os canais responsaveis pela protecao."],c:3,e:"A tecnologia nao deve incentivar o jovem a agir sozinho em situacoes de risco. A orientacao e procurar adultos e servicos responsaveis pela protecao."},
{q:"Qual e o papel da MentorIA em uma situacao de possivel risco?",a:["Investigar o caso e decidir a punicao.","Substituir o Conselho Tutelar.","Orientar, informar e encaminhar para ajuda humana e canais oficiais.","Resolver o caso sem envolver ninguem."],c:2,e:"A MentorIA e uma ferramenta educativa e de apoio. Ela nao substitui o Conselho Tutelar, a assistencia social ou outros profissionais."]
];
var state={mode:null,i:0,score:0,answers:[],before:null,after:null};
function setNav(id){var btns=document.querySelectorAll('.nav button');for(var k=0;k<btns.length;k++)btns[k].className=btns[k].className.replace(' active','');if(id)document.getElementById(id).className+=' active';}
function home(){setNav('nHome');var html='';html+='<div class="card"><span class="badge">MVP - Prototipo de validacao</span><h2 style="margin-top:10px">MentorIA Shield</h2>';html+='<p>Uma experiencia educativa para ajudar criancas e adolescentes a reconhecer sinais de trabalho infantil, exploracao, aliciamento e falsas oportunidades.</p>';html+='<button onclick="futuro()">Comecar aprendizado</button><button class="secondary" onclick="shield()">Conhecer a MentorIA Shield</button><button class="light" onclick="startTest(\'before\')">Continuar de onde parei</button></div>';html+='<div class="card"><h3>Como funciona</h3><p class="muted">Aprender -> responder situacoes -> receber orientacao -> buscar ajuda segura quando necessario.</p></div><div class="card"><h3>Principio de seguranca</h3><p class="muted">A MentorIA e uma ferramenta educativa. Nao diagnostica, investiga, decide medidas protetivas nem substitui profissionais da rede de protecao.</p></div>';document.getElementById('app').innerHTML=html;}
function shield(){setNav('nShield');var html='<div class="card"><span class="badge">MentorIA Shield</span><h2 style="margin-top:10px">Aprenda a reconhecer sinais de risco</h2><p>Escolha um modulo para aprender antes de fazer o teste.</p><button onclick="learn(\'Trabalho infantil\')">Trabalho infantil</button><button onclick="learn(\'Falsas oportunidades\')">Falsas oportunidades</button><button onclick="learn(\'Aliciamento e exploracao\')">Aliciamento e exploracao</button><button onclick="learn(\'Como pedir ajuda\')">Como pedir ajuda</button></div>';document.getElementById('app').innerHTML=html;}
function learn(title){var html='<div class="card"><span class="badge">Modulo educativo</span><h2 style="margin-top:10px">'+title+'</h2><p>Observe situacoes que podem envolver pressao, segredo, exploracao, prejuizo a escola, a saude, ao descanso ou a convivencia familiar.</p><div class="card" style="background:#f7f9ff"><h3>Sinais de atencao</h3><p class="muted">- pedidos de segredo<br>- promessas de dinheiro facil<br>- pressao ou medo<br>- prejuizo a escola<br>- jornada ou condicoes inseguras<br>- necessidade de procurar ajuda</p></div><button onclick="startTest(\'before\')">Fazer teste</button><button class="secondary" onclick="shield()">Voltar</button></div>';document.getElementById('app').innerHTML=html;}
function startTest(mode){state={mode:mode,i:0,score:0,answers:[],before:state.before,after:state.after};setNav('nTest');renderQ();}
function renderQ(){var q=questions[state.i];var pct=Math.round((state.i/questions.length)*100);var html='<div class="card"><div class="pill"><span class="badge">'+(state.mode==='before'?'Teste inicial':'Teste apos aprendizagem')+'</span><span class="small">'+(state.i+1)+'/'+questions.length+'</span></div><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><h3>'+q.q+'</h3>';for(var k=0;k<q.a.length;k++)html+='<button class="option" onclick="answer('+k+')">'+String.fromCharCode(65+k)+') '+q.a[k]+'</button>';html+='</div>';document.getElementById('app').innerHTML=html;}
function answer(i){var q=questions[state.i];state.answers.push(i);if(i===q.c)state.score++;var feedback=(i===q.c)?'<div class="ok"><b>Boa escolha!</b></div>':'<div class="warn"><b>Atencao</b></div>';document.getElementById('app').innerHTML='<div class="card"><h2>'+feedback+'</h2><p>'+q.e+'</p><button onclick="nextQ()">Continuar</button></div>';}
function nextQ(){state.i++;if(state.i<questions.length)renderQ();else finish();}
function finish(){var score=state.score,pct=Math.round(score/questions.length*100);if(state.mode==='before')state.before=pct;else state.after=pct;var msg=state.mode==='before'?'Agora use o modulo educativo e faca o teste novamente.':'Compare o resultado com o teste inicial.';var html='<div class="card"><span class="badge">Resultado</span><div class="result">'+score+'/'+questions.length+'</div><h2>'+pct+'% de acertos</h2><p>'+msg+'</p>';if(state.before!==null&&state.after!==null){var diff=state.after-state.before;html+='<div class="card"><h3>Validacao antes x depois</h3><p><b>Antes:</b> '+state.before+'%</p><p><b>Depois:</b> '+state.after+'%</p><p><b>Variacao:</b> '+(diff>=0?'+':'')+diff+' pontos percentuais</p></div>';}if(state.mode==='before')html+='<button onclick="shield()">Aprender antes do segundo teste</button>';else html+='<button onclick="startTest(\'after\')">Refazer teste</button>';html+='<button class="secondary" onclick="exportResult()">Salvar resultado</button></div>';document.getElementById('app').innerHTML=html;}
function exportResult(){var beforeTxt=state.before==null?'-':state.before,afterTxt=state.after==null?'-':state.after,text='MentorIA Shield - Registro de validacao\nData: '+new Date().toLocaleString('pt-BR')+'\nTeste: '+state.mode+'\nResultado: '+state.score+'/'+questions.length+' ('+Math.round(state.score/questions.length*100)+'%)\nAntes: '+beforeTxt+'%\nDepois: '+afterTxt+'%';try{var blob=new Blob([text],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resultado_mentoria_shield.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);}catch(err){alert(text);}}
function chat(){setNav('nChat');document.getElementById('app').innerHTML='<div class="card"><span class="badge">MentorIA</span><h2 style="margin-top:10px">Orientacao educativa</h2><p class="muted">Prototipo demonstrativo. Nao substitui profissionais.</p><input id="chatInput" placeholder="Digite uma situacao..."><button onclick="chatReply()">Enviar</button><div id="reply"></div></div>';}
function chatReply(){var x=document.getElementById('chatInput').value.trim(),r=document.getElementById('reply');if(!x){r.innerHTML='<p class="warn">Digite uma situacao para continuar.</p>';return;}r.innerHTML='<div class="card"><b>MentorIA:</b><p>Posso ajudar voce a reconhecer sinais de alerta. Se houver segredo, pressao, promessa de dinheiro facil, pedido de dados pessoais ou prejuizo a escola, saude ou seguranca, nao tome decisoes sozinho. Converse com um adulto de confianca e procure os canais oficiais de protecao.</p><p class="small muted">Resposta educativa do prototipo. A MentorIA nao investiga nem decide medidas de protecao.</p></div>';}
var futuroContent={aprender:{badge:'Trilha de aprendizagem',title:'Aprender',intro:'Aprender e a base para construir o seu futuro com seguranca. Aqui voce encontra caminhos para organizar seus estudos e continuar aprendendo todos os dias.',items:[{title:'Organize seus estudos',desc:'Defina um horario fixo para estudar, separe suas anotacoes por materia e revise o conteudo com frequencia.'},{title:'Tecnicas de aprendizagem',desc:'Resuma o que aprendeu com suas proprias palavras, ensine para alguem e faca pausas curtas entre os estudos.'},{title:'Valorize a escola',desc:'A escola protege seus direitos e abre portas para o futuro. Frequencia e participacao fazem toda a diferenca.'},{title:'Recursos gratuitos',desc:'Bibliotecas publicas, plataformas educacionais gratuitas e professores sao aliados importantes na sua jornada.'}]},interesses:{badge:'Autoconhecimento',title:'Descobrir interesses',intro:'Conhecer o que voce gosta de fazer ajuda a escolher caminhos de estudo e trabalho no futuro. Pense nas perguntas abaixo:',items:[{title:'Arte e criatividade',desc:'Voce gosta de desenhar, criar, escrever ou inventar coisas novas?'},{title:'Esportes e movimento',desc:'Voce se sente bem praticando esportes ou atividades fisicas?'},{title:'Ciencia e tecnologia',desc:'Tem curiosidade sobre como as coisas funcionam ou gosta de computadores?'},{title:'Cuidar de pessoas',desc:'Gosta de ajudar, ensinar ou cuidar de outras pessoas e animais?'}]},profissoes:{badge:'Mapa de profissoes',title:'Conhecer profissoes',intro:'Existem muitos caminhos profissionais possiveis. Conhecer as areas ajuda a planejar os proximos passos dos seus estudos.',items:[{title:'Tecnologia',desc:'Desenvolvedor, analista de dados, designer digital, entre outras profissoes em crescimento.'},{title:'Saude',desc:'Enfermagem, medicina, fisioterapia e outras areas que cuidam do bem-estar das pessoas.'},{title:'Educacao e humanas',desc:'Professor, pedagogo, psicologo e profissionais que constroem conhecimento e cidadania.'},{title:'Meio ambiente',desc:'Engenharia ambiental, agronomia e profissoes que cuidam do planeta.'}]},habilidades:{badge:'Habilidades para o futuro',title:'Desenvolver habilidades',intro:'Alem do conhecimento tecnico, algumas habilidades ajudam em qualquer area da vida e do trabalho.',items:[{title:'Comunicacao',desc:'Saber ouvir e se expressar com clareza ajuda em qualquer relacao ou trabalho em equipe.'},{title:'Resolucao de problemas',desc:'Pensar em solucoes diante de desafios e uma habilidade valorizada em qualquer area.'},{title:'Trabalho em equipe',desc:'Colaborar, respeitar diferencas e dividir tarefas fortalece qualquer grupo.'},{title:'Uso responsavel da tecnologia',desc:'Usar a internet com seguranca, proteger seus dados e saber identificar riscos online.'}]}};
function futuro(){setNav('nFuturo');document.getElementById('app').innerHTML='<div class="card"><span class="badge">Mapa do Futuro</span><h2 style="margin-top:10px">Descubra possibilidades para o seu futuro</h2><p>Explore seus interesses, habilidades e caminhos de aprendizagem para construir um futuro com seguranca.</p><button onclick="futuroModule(\'aprender\')">Aprender</button><button onclick="futuroModule(\'interesses\')">Descobrir interesses</button><button onclick="futuroModule(\'profissoes\')">Conhecer profissoes</button><button onclick="futuroModule(\'habilidades\')">Desenvolver habilidades</button></div>';}
function futuroModule(key){var m=futuroContent[key],html='<div class="card"><span class="badge">'+m.badge+'</span><h2 style="margin-top:10px">'+m.title+'</h2><p>'+m.intro+'</p></div>';for(var k=0;k<m.items.length;k++)html+='<div class="card"><h3>'+m.items[k].title+'</h3><p class="muted">'+m.items[k].desc+'</p></div>';html+='<div class="card"><button onclick="futuro()">Voltar</button><button class="secondary" onclick="home()">Inicio</button></div>';document.getElementById('app').innerHTML=html;}
home();
</script>
</body>
</html>
