<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MentorIA Shield</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.app{max-width:720px;margin:auto;min-height:100vh}.top{background:#173b99;color:#fff;padding:28px 22px;border-radius:0 0 24px 24px}.logo{font-size:28px;font-weight:800}.sub{margin-top:5px}.content{padding:18px}.card{background:#fff;border:1px solid #dfe4ee;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}button{display:block;width:100%;border:0;border-radius:13px;padding:14px;margin:9px 0;font-size:16px;font-weight:700;cursor:pointer;background:#2557d6;color:white}button.secondary{background:#eef2ff;color:#173b99}.badge{display:inline-block;background:#eef2ff;color:#173b99;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700}.muted{color:#65708a}.nav{position:sticky;bottom:0;background:white;border-top:1px solid #dfe4ee;padding:10px;display:flex;gap:7px}.nav button{margin:0;padding:12px 5px;background:#f0f2f7;color:#25304a;font-size:13px}.nav button.active{background:#e9efff;color:#173b99}.option{text-align:left;background:white;color:#172033;border:1px solid #dfe4ee}.progress{height:8px;background:#e7eaf0;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#2557d6}.ok{color:#16834b}.warn{color:#b56a00}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dfe4ee;border-radius:12px;font-size:16px}</style></head><body><div class="app"><header class="top"><div class="logo">MentorIA</div><div class="sub">Educação • Proteção • Futuro</div></header><main class="content" id="app"></main><nav class="nav"><button data-page="home">Início</button><button data-page="shield">Shield</button><button data-page="teste">Teste</button><button data-page="chat">MentorIA</button><button data-page="futuro">Futuro</button></nav></div><script>
(function(){var app=document.getElementById('app'),nav=document.querySelectorAll('.nav button');var qs=[['Uma pessoa oferece dinheiro e pede segredo. O que é mais seguro?',['Aceitar','Guardar segredo','Conversar com um adulto de confiança','Aceitar se pagar bem'],2],['Uma atividade faz você faltar à escola e ficar muito cansado. O que fazer?',['Continuar','Esconder as faltas','Conversar com um adulto de confiança','Ignorar'],2],['Alguém promete dinheiro fácil e pede seus dados pessoais. Qual é o alerta?',['Nada','Apenas a internet','Pedido de dados e segredo','A simpatia da pessoa'],2],['Você suspeita de exploração do trabalho de uma criança. O que fazer?',['Investigar sozinho','Confrontar alguém','Ignorar','Procurar um adulto e canais de proteção'],3],['Qual é o papel da MentorIA?',['Punir','Substituir profissionais','Orientar e encaminhar para ajuda humana','Investigar'],2]];var score=0,qi=0;function active(page){nav.forEach(function(b){b.classList.toggle('active',b.dataset.page===page)})}function home(){active('home');app.innerHTML='<div class="card"><span class="badge">MVP • Protótipo</span><h2>MentorIA Shield</h2><p>Uma experiência educativa para reconhecer sinais de trabalho infantil, exploração, aliciamento e falsas oportunidades.</p><button data-go="shield">Conhecer o Shield</button><button data-go="teste">Fazer o teste</button><button data-go="futuro">Explorar o Futuro</button></div><div class="card"><h3>Como funciona</h3><p class="muted">Aprender → responder situações → receber orientação → buscar ajuda segura quando necessário.</p></div>'}function shield(){active('shield');app.innerHTML='<div class="card"><span class="badge">MentorIA Shield</span><h2>Reconheça sinais de risco</h2><p>Observe sinais como segredo, pressão, promessas de dinheiro fácil, pedido de dados pessoais e prejuízo à escola ou à segurança.</p><h3>O que fazer?</h3><p>Não tome decisões sozinho em uma situação de risco. Converse com um adulto de confiança e procure os canais responsáveis pela proteção.</p><button data-go="teste">Fazer teste</button></div>'}function teste(){active('teste');qi=0;score=0;question()}function question(){var q=qs[qi],p=Math.round(qi/qs.length*100),h='<div class="card"><span class="badge">Teste • '+(qi+1)+'/'+qs.length+'</span><div class="progress"><div class="bar" style="width:'+p+'%"></div></div><h3>'+q[0]+'</h3>';q[1].forEach(function(a,i){h+='<button class="option" data-answer="'+i+'">'+String.fromCharCode(65+i)+') '+a+'</button>'});h+='</div>';app.innerHTML=h}function answer(i){var q=qs[qi],ok=i===q[2];if(ok)score++;app.innerHTML='<div class="card"><h2 class="'+(ok?'ok':'warn')+'">'+(ok?'Boa escolha!':'Atenção')+'</h2><p>'+(ok?'Essa é a atitude mais segura.':'Em uma situação de risco, procure um adulto de confiança e não aja sozinho.')+'</p><button data-next="1">Continuar</button></div>'}function next(){qi++;if(qi<qs.length)question();else app.innerHTML='<div class="card"><span class="badge">Resultado</span><h2>'+score+'/'+qs.length+' acertos</h2><p>Você concluiu o teste educativo.</p><button data-go="shield">Rever conteúdo</button><button data-go="teste">Refazer teste</button></div>'}function chat(){active('chat');app.innerHTML='<div class="card"><span class="badge">MentorIA</span><h2>Orientação educativa</h2><p class="muted">Protótipo demonstrativo. Não substitui profissionais.</p><input id="msg" placeholder="Digite uma situação..."><button data-chat="1">Enviar</button><div id="reply"></div></div>'}function futuro(){active('futuro');app.innerHTML='<div class="card"><span class="badge">Mapa do Futuro</span><h2>Construa seu futuro</h2><p>Aprender e conhecer seus interesses ajuda a construir caminhos seguros.</p><button data-go="aprender">Aprender</button><button data-go="interesses">Descobrir interesses</button><button data-go="profissoes">Conhecer profissões</button><button data-go="habilidades">Desenvolver habilidades</button></div>'}function module(k){var d={aprender:['Aprender','Organize seus estudos, revise o conteúdo e valorize a frequência escolar.'],interesses:['Descobrir interesses','Arte, esportes, ciência, tecnologia e cuidado com pessoas são alguns caminhos para explorar.'],profissoes:['Conhecer profissões','Tecnologia, saúde, educação, meio ambiente e muitas outras áreas oferecem diferentes possibilidades.'],habilidades:['Desenvolver habilidades','Comunicação, resolução de problemas, trabalho em equipe e uso responsável da tecnologia são úteis em qualquer caminho.']}[k];app.innerHTML='<div class="card"><span class="badge">Mapa do Futuro</span><h2>'+d[0]+'</h2><p>'+d[1]+'</p><button data-go="futuro">Voltar</button></div>'}nav.forEach(function(b){b.addEventListener('click',function(){go(b.dataset.page)})});document.addEventListener('click',function(e){var g=e.target.dataset.go;if(g)go(g);if(e.target.dataset.answer!==undefined)answer(Number(e.target.dataset.answer));if(e.target.dataset.next)next();if(e.target.dataset.chat){var x=document.getElementById('msg').value.trim();document.getElementById('reply').innerHTML='<div class="card"><b>MentorIA:</b><p>'+(x?'Se houver pressão, segredo, promessa de dinheiro fácil ou pedido de dados, converse com um adulto de confiança e procure ajuda.':'Digite uma situação para continuar.')+'</p></div>'}});function go(p){if(p==='home')home();else if(p==='shield')shield();else if(p==='teste')teste();else if(p==='chat')chat();else if(p==='futuro')futuro();else module(p)}home()})();</script></body></html>
