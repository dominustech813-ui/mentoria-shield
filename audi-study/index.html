{id:'space',t:'The Wonders of Space Exploration',x:`For decades, humanity has been captivated by the vast mysteries of the cosmos. Space exploration not only fulfills our innate curiosity but also drives technological innovation. When engineers design spacecraft, they must account for the extreme conditions of the vacuum of space, including dangerous radiation and freezing temperatures. Furthermore, establishing sustainable habitats on other planets, such as Mars, remains one of the most formidable scientific challenges of the 21st century.`,q:[['What are the two main benefits of space exploration mentioned in the text?','It fulfills humanity’s innate curiosity and drives technological innovation.'],['What are the extreme conditions that spacecraft engineers must consider?','The vacuum of space, dangerous radiation, and freezing temperatures.'],['How does the text describe the challenge of building habitats on other planets?','It is described as one of the most formidable (difficult) scientific challenges of the 21st century.'],['Which planet is specifically mentioned as a candidate for sustainable habitats?','Mars.'],['Why is designing spacecraft so complex regarding the environment?','Because engineers must account for extreme, dangerous, and harsh environments.']]},
{id:'clarkson',t:'Clarkson',x:`Clarkson is a large town. It has more than fifty thousand people living there. It sits next to a large river, the Clark River. Every day, people take the ferry from North Clarkson to South Clarkson to go to work.\n\nMost people live in North Clarkson. There are many trees and the streets are very broad. When the sun shines and the children run and play in the safe streets, North Clarkson is a wonderful place to live.\n\nSouth Clarkson has a lot of shops and factories. People don't live there, but they come in the morning to work. There is also a big stadium where the Clarkson Tigers play. On Sundays, many people go to watch their favorite team.\n\nAt the weekend, people from Clarkson enjoy walking along the bank of the Clark River. They also sail small boats on the water and if there is a little wind, they fly kites in the large park.\n\nEvery year, Clarkson grows in size because a lot of people come to live there. The government builds more houses and the streets get bigger. Maybe in the future, if the town continues to grow, it will become a city!`,q:[['What is there near Clarkson?','A river — the Clark River.'],['What is there in North Clarkson?','Wide/broad streets and many trees.'],['Where is the stadium?','South Clarkson.'],['What do people in Clarkson do at the weekend?','They enjoy walking along the river bank, sailing small boats, and flying kites in the park.'],['Which statement is true?','Clarkson is a popular/growing town.']]},
{id:'green',t:'The Green City Project',x:`Environmental awareness is growing among young people. Last month, a group of seventh-grade students in Oregon started "The Green City Project." Their goal is to reduce plastic waste in their school. They noticed that the school used thousands of single-use plastic bottles every week. To solve this, the students organized a campaign to collect recycled bottles and bought three water-refill stations for the school corridors. Now, students carry reusable flasks. The school principal announced that plastic waste has decreased by 60% since the project began. The team hopes to expand their initiative to other schools in the district next term.`,q:[['What is the main objective of The Green City Project?','To reduce plastic waste in school.'],['How did the students get the money to buy the water-refill stations?','They sold handmade canvas bags.'],['What change occurred after installing the new stations?','Single-use plastic waste dropped by 60%.'],['What does the project team plan to do next term?','Bring the initiative to other schools.']]},
{id:'camp',t:'Eco-Keepers Camp',x:`Last summer, fourteen-year-old Liam and his classmates went on a very unusual school trip. They traveled to Eco-Keepers Camp, a nature reserve deep in the mountains. The most important rule of the camp was simple but difficult: no electronic devices were allowed. Every student had to turn off their smartphones, tablets, and smartwatches on the first morning. At first, Liam felt confused and disconnected. He was used to checking his phone every ten minutes, playing online video games, and scrolling through social media. However, after three days without any notifications, something changed. They woke up early every day to the sound of birds instead of loud alarms. During the mornings, they learned how to plant trees and filter river water. In the afternoons, they went hiking, kayaked across a beautiful lake, and practiced archery. Liam discovered that he was actually very good at kayaking and he enjoyed taking pictures with the disposable camera he found. By the end of the week, nobody missed their phones. On the last night, they sat around a campfire, roasted marshmallows, and shared stories under the stars. When the teachers returned their smartphones on Saturday, Liam didn't even want to turn his on immediately. He realized that the real world was much more exciting.`,q:[['What was the main rule of Eco-Keepers Camp?','No electronic devices were permitted.'],['How did Liam feel during the first days at the camp?','Confused and disconnected.'],['Which outdoor activity did Liam discover he was skilled at?','Kayaking.'],['Liam and his friends stayed at a hotel near the beach. True or False?','False.'],['The students used their phones only during the evenings. True or False?','False.'],['At the end of the trip, Liam was desperate to turn his phone back on. True or False?','False.']]},
{id:'garden',t:'The Community Garden',x:`Sarah lives in a busy city, but her favorite place is a quiet spot in her neighborhood: the community garden. Three years ago, the area was just an empty lot full of trash. Then, Mr. Davis, a retired science teacher, decided to change it. He invited the neighbors to help clean the space and plant seeds. Today, the garden is beautiful. There are colorful flowers, tall tomato plants, carrots, and a big apple tree. Every Saturday morning, Sarah and her friends go there to volunteer. Sarah likes watering the flowers, while her friend Lucas prefers pulling out weeds. Mr. Davis teaches them how to care for the plants and protect them from insects without using harmful chemicals. The garden is not only for growing food; it is also a place for the community to connect. Every month, they have a "Garden Market," where neighbors can buy fresh vegetables. The money they make is used to buy new seeds and tools. Sarah loves the garden because it taught her that cooperation can transform a community.`,q:[['What was the community garden area three years ago?','An empty lot full of trash.'],['Who started the community garden project?','Mr. Davis.'],['What does Lucas like to do in the garden?','Pull out weeds.'],['How does the community use the money from the Garden Market?','To buy new seeds and tools.']]},
{id:'keys',t:'The Mystery of the Missing Keys',x:`Lucas was already ten minutes late for school, and he still could not find his house keys. He checked his backpack for the third time, but only found his math notebook, a squashed banana, and his library book. "Did you look on the kitchen counter?" his older sister, Clara, shouted from the front door. She was holding her bicycle helmet and looking impatient. Lucas ran into the kitchen. The counter was covered in empty cereal bowls and the morning newspaper, but there were no keys. He was starting to panic because his bus was leaving in exactly five minutes. Just as he was about to give up, he heard a strange jingling sound coming from the living room. He walked into the room and saw his puppy, Buster, sitting proudly on the rug. Buster was happily chewing on a blue plastic keychain. Underneath the puppy's paws were Lucas's missing keys. Lucas grabbed the keys, thanked Buster with a quick pat on the head, and sprinted out the door just in time to catch his bus.`,q:[['Why was Lucas feeling panicked?','He was running late and could not find his keys.'],['What did Lucas find inside his backpack?','A math notebook, a squashed banana, and his library book.'],['Where did Lucas finally find his keys?','Under his puppy Buster’s paws in the living room.'],['How did Lucas get to school that morning?','He caught the school bus.']]}

{id:'artdescription',t:'Unit 3 — Reading: Describing Artwork',x:`An artwork can be described by its type, appearance and meaning. A description may say whether a work is realistic or abstract and can use adjectives such as beautiful, fantastic, strange, colorful, blurred, detailed or traditional. A good description also explains what the artist may want to communicate and what the viewer notices.`},

{title:'⏰ Past Simple — Passado simples',body:`Usamos para ações terminadas no passado.\nAffirmative: I/You/He/She/It/We/They played.\nNegative: subject + did not (didn’t) + verb base.\nQuestion: Did + subject + verb base?\nShort answer: Yes, I/he/she/they did. / No, I/he/she/they didn’t.\nCom BE: was (I/he/she/it) e were (you/we/they).`},
{title:'🔁 Used to',body:`Usamos USED TO + verbo base para hábitos ou situações do passado que não acontecem mais.\nAffirmative: I used to play.\nNegative: I didn’t use to play.\nQuestion: Did you use to play?\nDepois de did/didn’t, use USE TO, não USED TO.`},
{title:'📚 Irregular verbs',body:`Alguns verbos não formam o passado apenas com -ed. Exemplos: be → was/were; go → went; have → had; do → did; see → saw; write → wrote; take → took; make → made; come → came; find → found.`},

const AUDI_PROFILE_KEY='audiLearningProfileV1';
function getProfile(){
  try{return JSON.parse(localStorage.getItem(AUDI_PROFILE_KEY))||{topics:{},errors:[],streak:0,lastDay:'',lastQuiz:0};}
  catch(e){return {topics:{},errors:[],streak:0,lastDay:'',lastQuiz:0};}
}
function saveProfile(p){localStorage.setItem(AUDI_PROFILE_KEY,JSON.stringify(p));}
function todayKey(){return new Date().toISOString().slice(0,10);}
function topicForQuestion(q, sourceType){
  const s=(q||'').toLowerCase();
  if(sourceType==='reading' || /what did|what is|where is|who started|which statement|true or false|main objective|near clarkson|under buster|activity did liam|community garden|green city|clarkson/.test(s)) return 'Reading & Comprehension';
  if(/used to/.test(s)) return 'Used to';
  if(/\bdid\b|past simple|yesterday|last year|last summer/.test(s)) return 'Past Simple / DID';
  if(/\bdoes\b|\bdo\b|simple present|every (day|week|month|morning)|doesn/.test(s)) return 'Simple Present / DO / DOES';
  if(/translate|traduza|tradução/.test(s)) return 'Translation';
  if(/vocab|word|meaning|expression|idiom|art/.test(s)) return 'Vocabulary';
  return 'General English';
}
function recordAttempt(topic, correct, usedHint=false, source='quiz'){
  const p=getProfile();
  if(!p.topics[topic])p.topics[topic]={seen:0,correct:0,hints:0,wrong:0};
  const t=p.topics[topic]; t.seen++; if(correct)t.correct++; else t.wrong++; if(usedHint)t.hints++;
  if(!Array.isArray(p.errors))p.errors=[];
  if(!correct){
    p.errors.unshift({topic,source,date:new Date().toLocaleString('pt-BR')});
    p.errors=p.errors.slice(0,40);
  }
  const d=todayKey();
  if(p.lastDay!==d){p.streak=(p.lastDay && (new Date(d)-new Date(p.lastDay))/86400000===1)?(p.streak||0)+1:1;p.lastDay=d;}
  p.lastQuiz=(p.lastQuiz||0)+1;
  saveProfile(p);
}
function topicMastery(topic){
  const t=getProfile().topics[topic];
  if(!t||!t.seen)return 0;
  return Math.round(t.correct/t.seen*100);
}
function weakTopics(){
  const p=getProfile();
  return Object.entries(p.topics).filter(([k,v])=>v.seen>=1).sort((a,b)=>(a[1].correct/a[1].seen)-(b[1].correct/b[1].seen)).map(x=>x[0]);
}
function brainPage(){
  nav('nBrain');
  const p=getProfile(), entries=Object.entries(p.topics);
  const strongest=entries.filter(([k,v])=>v.seen>0).sort((a,b)=>(b[1].correct/b[1].seen)-(a[1].correct/a[1].seen)).slice(0,3);
  const weakest=entries.filter(([k,v])=>v.seen>0).sort((a,b)=>(a[1].correct/a[1].seen)-(b[1].correct/b[1].seen)).slice(0,3);
  const card=(arr,empty)=>arr.length?arr.map(([k,v])=>{let m=Math.round(v.correct/v.seen*100);return `<div class="topic"><b>${esc(k)}</b><br><span class="muted">${v.correct}/${v.seen} acertos • ${m}%</span><div style="height:7px;background:#e7eaf0;border-radius:99px;margin-top:7px"><div style="height:100%;width:${m}%;background:#2458d6;border-radius:99px"></div></div></div>`}).join(''):empty;
  const last=weakest[0]?.[0]||'Ainda estamos descobrindo';
  app.innerHTML=`<div class="card"><span class="badge">🧠 Perfil de aprendizagem</span><h2>Meu cérebro</h2><p>Eu observo <b>como você erra</b> para escolher o próximo treino. A nota não é a única coisa importante.</p><div class="grid"><div class="topic"><b>🔥 Sequência</b><br>${p.streak||0} dia(s)</div><div class="topic"><b>📝 Tentativas</b><br>${p.lastQuiz||0}</div></div></div>
  <div class="card"><h3>🟢 Você está dominando</h3>${card(strongest,'Ainda não há dados suficientes.')}</div>
  <div class="card"><h3>🔴 Precisa praticar</h3>${card(weakest,'Faça alguns exercícios para eu descobrir suas dificuldades.')}</div>
  <div class="card"><span class="badge">🎯 Próximo foco</span><h3>${esc(last)}</h3><p>O próximo treino adaptativo vai dar prioridade a esse assunto.</p><button onclick="adaptiveQuiz()">🚀 Treino adaptativo</button><button class="secondary" onclick="brainExplain()">🤖 Explique meu desempenho com IA</button></div>
  <div class="card"><h3>🔁 Seus erros recentes</h3>${p.errors.length?p.errors.slice(0,8).map(e=>`<div class="answer"><b>${esc(e.topic)}</b><br><span class="muted">${esc(e.date)}</span></div>`).join(''):'<p class="muted">Nenhum erro registrado ainda.</p>'}<button class="secondary" onclick="resetBrain()">Zerar meu histórico</button></div>`;
}
function resetBrain(){
  if(confirm('Zerar todo o histórico de aprendizagem?')){localStorage.removeItem(AUDI_PROFILE_KEY);brainPage();}
}
function brainExplain(){
  const p=getProfile(), weak=weakTopics().slice(0,3);
  aiPage(`Analise meu perfil de aprendizagem da AUDI STUDY IA. Meus assuntos que mais precisam de prática são: ${weak.join(', ')||'ainda não há dados suficientes'}. Explique de forma fácil e monte um plano curto de estudo.`);
}

function voiceNormalize(s){
 return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
 .replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim();
}
function voiceLev(a,b){
 a=voiceNormalize(a);b=voiceNormalize(b);
 const A=[...a],B=[...b],dp=Array.from({length:A.length+1},()=>Array(B.length+1).fill(0));
 for(let i=0;i<=A.length;i++)dp[i][0]=i;
 for(let j=0;j<=B.length;j++)dp[0][j]=j;
 for(let i=1;i<=A.length;i++)for(let j=1;j<=B.length;j++)
  dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(A[i-1]===B[j-1]?0:1));
 return Math.max(0,1-dp[A.length][B.length]/Math.max(A.length,B.length,1));
}
function voiceWordCoverage(target,heard){
 const t=voiceNormalize(target).split(' ').filter(Boolean),h=voiceNormalize(heard).split(' ').filter(Boolean),used=new Set();
 let hits=0;
 for(const tw of t){
  let best=-1,bs=0;
  h.forEach((hw,i)=>{if(!used.has(i)){const s=voiceLev(tw,hw);if(s>bs){bs=s;best=i;}}});
  if(best>=0&&bs>=.68){hits++;used.add(best);}
 }
 return t.length?hits/t.length:0;
}

/* === AUDI VOICE — iOS + ANDROID ROBUST ===
   IMPORTANT: do NOT call getUserMedia() here. SpeechRecognition itself owns
   microphone permission. Calling getUserMedia() first can create a second
   permission flow on mobile browsers. Recognition is started only from the
   user's tap on "Falar agora", which is required by Safari/iOS. */
let audiMicPermission = 'unknown';
function audiSpeechCtor(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}
function audiIsSecure(){
  return window.isSecureContext || location.protocol==='https:' ||
         location.hostname==='localhost' || location.hostname==='127.0.0.1';
}
function audiBrowserName(){
  const ua=navigator.userAgent||'';
  if(/iPhone|iPad|iPod/i.test(ua)) return 'iPhone/iPad';
  if(/Android/i.test(ua)) return 'Android';
  return 'computador';
}
function audiPermissionMessage(){
  if(!audiIsSecure()) return '<div class="tip"><h3>🔒 Abra pelo GitHub Pages</h3><p>Para voz no celular, abra a Audi pelo endereço <b>HTTPS</b> do GitHub Pages. Não abra o arquivo baixado diretamente.</p></div>';
  return '<div class="tip"><h3>🎙️ Microfone</h3><p>Na primeira vez, toque em <b>Falar agora</b> e escolha <b>Permitir</b>. Depois, o navegador deve manter a permissão para este site enquanto ela permanecer autorizada.</p></div>';
}
function audiResetVoiceButton(){
  const b=document.getElementById('voiceStart');
  if(b){b.disabled=false;b.textContent='🎙️ Falar agora';}
}
function voiceRender(result=''){
  const l=voiceLessons[voiceState.lesson],it=l.items[voiceState.item];
  app.innerHTML=`<div class="card"><span class="badge">🎙️ Treino por voz</span><h2>${escVoice(l.title)}</h2><p class="muted">${escVoice(l.kind)} • ${voiceState.item+1} de ${l.items.length}</p><div style="height:8px;background:#e7eaf0;border-radius:99px"><div style="height:100%;width:${Math.round(voiceState.item/l.items.length*100)}%;background:#2458d6;border-radius:99px"></div></div></div>
  <div class="card"><span class="badge">🇺🇸 Fale em inglês</span><h2 style="line-height:1.35">${escVoice(it[0])}</h2><p class="muted">Significado: ${escVoice(it[1])}</p><button id="voiceStart" onclick="voiceStart()">🎙️ ${voiceState.listening?'Ouvindo...':'Falar agora'}</button><button class="secondary" onclick="voiceNext()">➡️ Próximo</button><div id="voiceFeedback">${result}</div><p class="small muted">No celular, o reconhecimento de voz é iniciado diretamente pelo seu toque. A permissão é controlada pelo navegador.</p></div>
  <div class="card"><h3>📚 Aprenda antes de falar</h3><p>Treine palavras, frases e textos dos conteúdos enviados.</p><button class="secondary" onclick="voiceMenu()">📖 Escolher conteúdo</button></div>`;
}

}
function voicePage(){
  nav('nVoice');
  const SR=audiSpeechCtor();
  if(!SR){
    app.innerHTML='<div class="card"><span class="badge">🎙️ Treino por voz</span><h2>Reconhecimento de voz não disponível neste navegador</h2><p>Use <b>Safari no iPhone/iPad</b> ou <b>Chrome no Android</b>. Evite abrir a Audi dentro de outro aplicativo ou visualizador interno.</p></div>';
    return;
  }
  if(!audiIsSecure()){
    app.innerHTML='<div class="card"><span class="badge">🎙️ Treino por voz</span>'+audiPermissionMessage()+'</div>';
    return;
  }
  voiceRender('<div class="tip">🎙️ <b>Pronto.</b> Toque em <b>Falar agora</b> para começar. O navegador pedirá a permissão somente quando necessário.</div>');
}
async function voiceStart(){
  const SR=audiSpeechCtor();
  if(!SR){return;}
  if(!audiIsSecure()){
    const f=document.getElementById('voiceFeedback');
    if(f)f.innerHTML=audiPermissionMessage();
    return;
  }

  // Do not call getUserMedia() here. On iOS/Android SpeechRecognition must be
  // started from the actual user gesture and handles its own microphone access.
  voiceStop();
  const r=new SR();
  voiceState.rec=r;
  voiceState.listening=true;
  voiceState.heard='';
  r.lang='en-US';
  r.continuous=false;
  r.interimResults=false;
  r.maxAlternatives=5;

  const b=document.getElementById('voiceStart');
  if(b){b.disabled=true;b.textContent='🎙️ Ouvindo... fale agora';}

  r.onstart=()=>{
    audiMicPermission='granted';
    const f=document.getElementById('voiceFeedback');
    if(f)f.innerHTML='<div class="tip">👂 Estou ouvindo... fale a palavra, frase ou texto em inglês.</div>';
  };
  r.onresult=e=>{
    let best='',bestConf=-1;
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];
      for(let j=0;j<res.length;j++){
        const tr=(res[j].transcript||'').trim();
        const cf=typeof res[j].confidence==='number'?res[j].confidence:0;
        if(tr && cf>=bestConf){best=tr;bestConf=cf;}
      }
    }
    if(best)voiceState.heard=best;
  };
  r.onerror=e=>{
    voiceState.listening=false;
    voiceState.rec=null;
    let msg='Não consegui reconhecer sua fala.';
    if(e.error==='not-allowed'){
      audiMicPermission='denied';
      msg='O acesso ao microfone/reconhecimento foi bloqueado. No iPhone: Ajustes → Safari → Microfone → Permitir para este site. No Android: Chrome → Configurações do site → Microfone → Permitir.';
    }else if(e.error==='service-not-allowed'){
      msg='O navegador não autorizou o serviço de reconhecimento. No iPhone, abra a Audi diretamente no Safari (não dentro de outro aplicativo). No Android, use Chrome.';
    }else if(e.error==='no-speech'){
      msg='Não detectei fala. Toque em Falar agora e fale claramente em inglês.';
    }else if(e.error==='audio-capture'){
      msg='Não consegui acessar o microfone. Verifique se outro aplicativo está usando o microfone.';
    }else if(e.error==='network'){
      msg='O reconhecimento de voz precisa de internet neste navegador.';
    }else if(e.error==='aborted'){
      return;
    }
    const f=document.getElementById('voiceFeedback');
    if(f)f.innerHTML='<div class="tip">⚠️ '+escVoice(msg)+'</div>';
    audiResetVoiceButton();
  };
  r.onend=()=>{
    voiceState.listening=false;
    voiceState.rec=null;
    if(voiceState.heard){
      voiceCheck(voiceState.heard);
    }else{
      audiResetVoiceButton();
    }
  };
  try{
    // This call remains directly inside the click handler, which is important
    // for Safari on iOS.
    r.start();
  }catch(e){
    voiceState.listening=false;
    voiceState.rec=null;
    audiResetVoiceButton();
    const f=document.getElementById('voiceFeedback');
    if(f)f.innerHTML='<div class="tip">⚠️ O reconhecimento não iniciou. Toque novamente em <b>Falar agora</b>.</div>';
  }
}
function voiceStop(){if(voiceState.rec){try{voiceState.rec.stop();}catch(e){}}voiceState.rec=null;voiceState.listening=false;}
function voiceCheck(heard){
 const target=voiceLessons[voiceState.lesson].items[voiceState.item][0];
 const sim=voiceLev(target,heard),cov=voiceWordCoverage(target,heard),score=Math.round((sim*.45+cov*.55)*100);
 const ok=score>=82,partial=score>=62;if(ok)voiceState.score++;
 const feedback=ok?`<div class="answer"><h3>🎉 Muito bom!</h3><p>A fala reconhecida ficou compatível com o texto-alvo.</p></div>`:
 partial?`<div class="tip"><h3>🟡 Quase!</h3><p>Você acertou boa parte. Repita prestando atenção nas palavras destacadas.</p></div>`:
 `<div class="tip"><h3>🔴 Ainda não</h3><p>A transcrição ficou diferente do texto-alvo. Tente novamente.</p></div>`;
 voiceRender(feedback+`<div class="answer"><b>Você falou:</b><br>${escVoice(heard)}<br><br><b>Esperado:</b><br>${escVoice(target)}<br><br><b>Correspondência estimada:</b> ${score}%</div><button class="secondary" onclick="voiceStart()">🎙️ Repetir</button>`);
 if(typeof recordAttempt==='function')recordAttempt(voiceLessons[voiceState.lesson].kind==='Palavras'?'Vocabulary':'Pronunciation / Grammar',ok,false,'voice');
}
function voiceNext(){
 voiceStop();voiceState.item++;
 const l=voiceLessons[voiceState.lesson];
 if(voiceState.item>=l.items.length){
  const pct=Math.round(voiceState.score/l.items.length*100);
  app.innerHTML=`<div class="card"><span class="badge">🏁 Treino concluído</span><div class="score">${voiceState.score}/${l.items.length}</div><h2>${pct}%</h2><p>Você concluiu o treino por voz.</p><button onclick="voiceChoose(${voiceState.lesson})">🔁 Refazer</button><button class="secondary" onclick="voiceMenu()">📚 Outro treino</button></div>`;
 }else voiceRender();
}

function translateEnglishToPortuguese(phrase){
 let p=phrase.trim();
 if(!p) return '<p>Envie a frase que você quer traduzir.</p>';

 // Common school vocabulary/phrases plus a compositional fallback.
 const replacements=[
  [/\bdoes\b/gi,''],
  [/\bpaul\b/gi,'Paul'],
  [/\beat\b/gi,'come'],
  [/\bpizza\b/gi,'pizza'],
  [/\bfor breakfast\b/gi,'no café da manhã'],
  [/\bin breakfast\b/gi,'no café da manhã'],
  [/\bthe\b/gi,'o/a'],
  [/\bmy\b/gi,'meu/minha'],
  [/\byour\b/gi,'seu/sua'],
  [/\bwhat\b/gi,'o que'],
  [/\bwhere\b/gi,'onde'],
  [/\bwhen\b/gi,'quando'],
  [/\bwho\b/gi,'quem'],
  [/\bwhy\b/gi,'por que'],
  [/\bhow\b/gi,'como'],
  [/\bdo\b/gi,''],
  [/\bdid\b/gi,''],
  [/\bdoesn't\b/gi,'não'],
  [/\bdon't\b/gi,'não'],
  [/\bdidn't\b/gi,'não'],
  [/\bis\b/gi,'é/está'],
  [/\bare\b/gi,'são/estão'],
  [/\bwas\b/gi,'era/estava'],
  [/\bwere\b/gi,'eram/estavam'],
  [/\bI\b/g,'eu'],
  [/\bhe\b/gi,'ele'],
  [/\bshe\b/gi,'ela'],
  [/\bthey\b/gi,'eles/elas'],
  [/\bwe\b/gi,'nós'],
  [/\byou\b/gi,'você/vocês'],
  [/\beat\b/gi,'comer'],
  [/\beats\b/gi,'come'],
  [/\beating\b/gi,'comendo'],
  [/\bplay\b/gi,'jogar'],
  [/\bplays\b/gi,'joga'],
  [/\blike\b/gi,'gostar'],
  [/\blikes\b/gi,'gosta']
 ];
 let translated=p;
 replacements.forEach(([a,b])=>translated=translated.replace(a,b));
 translated=translated.replace(/\s+/g,' ').trim().replace(/\s+([?.!,])/g,'$1');

 // Exact useful pattern for the user's example.
 if(/does\s+paul\s+eat\s+pizza\s+(for|in)\s+breakfast\??/i.test(p)){
   translated='Paul come pizza no café da manhã?';
 }
 return `<p><b>Tradução:</b></p><div class="answer">${esc(translated)}</div>
 <p><b>Frase original:</b> ${esc(p)}</p>
 <p class="small muted">Se quiser, também posso explicar a gramática e corrigir a frase em inglês.</p>`;
}

/* AUDI STUDY - Gestor de avaliações */
const audiStore='audi_manager_v1';
function audiData(){try{const d=JSON.parse(localStorage.getItem(audiStore)||'{}');return {exams:Array.isArray(d.exams)?d.exams:[],results:Array.isArray(d.results)?d.results:[]}}catch{return {exams:[],results:[]}}}
function audiSave(d){localStorage.setItem(audiStore,JSON.stringify(d))}
function audiEscape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function managerPage(){
 nav('nManager');
 const d=audiData();
 document.getElementById('app').innerHTML='<div class="card"><span class="badge">Projeto do Theo · Gestor inteligente</span><h2>📅 Provas e cronogramas</h2><p class="muted">Cadastre suas avaliações e distribua as revisões até a data de cada prova.</p><label>Matéria</label><input id="audiMatter" placeholder="Ex.: Matemática"><label>Data</label><input type="date" id="audiDate"><label>Conteúdos da prova</label><textarea id="audiTopics" placeholder="Ex.: proporção direta, inversa, equações"></textarea><button onclick="audiAddExam()">Salvar prova</button><div id="audiExams"></div></div><div class="card"><h2>🗓️ Meu plano de estudos</h2><label>Tempo diário (minutos)</label><input id="audiMinutes" type="number" min="10" max="180" value="30"><button onclick="audiPlan()">Criar cronograma</button><div id="audiSchedule"></div></div><div class="card"><h2>🤖 Comandos para AUDI IA</h2><p>Peça um simulado, um resumo, uma explicação passo a passo ou um cronograma.</p><button onclick="aiPage('Tenho prova e preciso de um cronograma. Monte meu plano de estudos.')">Montar cronograma com IA</button><button class="secondary" onclick="aiPage('Crie um simulado de matemática do 7º ano, com 10 questões e gabarito no final.')">Criar simulado com IA</button><button class="secondary" onclick="aiPage('Analise meus erros e me explique como melhorar.')">Analisar meus erros</button></div>';
 audiRenderExams();
}
function audiAddExam(){
 const subject=(document.getElementById('audiMatter').value||'').trim(),date=document.getElementById('audiDate').value,topics=(document.getElementById('audiTopics').value||'').trim();
 if(!subject||!date||!topics){alert('Informe matéria, data e conteúdos.');return}
 const d=audiData();d.exams.push({id:Date.now()+Math.random(),subject,date,topics});audiSave(d);managerPage();
}
function audiRemoveExam(id){const d=audiData();d.exams=d.exams.filter(x=>String(x.id)!==String(id));audiSave(d);managerPage()}
function audiRenderExams(){
 const el=document.getElementById('audiExams');if(!el)return;const d=audiData();
 el.innerHTML='<h3>Avaliações cadastradas</h3>'+(d.exams.length?d.exams.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>'<div class="lesson"><b>'+audiEscape(e.subject)+'</b> · '+audiEscape(e.date)+'<br>'+audiEscape(e.topics)+'<button class="secondary" onclick="audiRemoveExam('+JSON.stringify(String(e.id))+')">Excluir</button></div>').join(''):'<p class="muted">Nenhuma prova cadastrada.</p>');
}
function audiPlan(){
 const el=document.getElementById('audiSchedule');const d=audiData(),now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const mins=Math.max(10,Math.min(180,Number(document.getElementById('audiMinutes').value)||30));
 const exams=d.exams.filter(e=>new Date(e.date+'T00:00:00')>=today).sort((a,b)=>a.date.localeCompare(b.date));
 if(!exams.length){el.innerHTML='<p>Cadastre uma prova futura para gerar seu cronograma.</p>';return}
 let out='<p class="muted">Distribuição sugerida; ajuste conforme seu ritmo.</p>';for(const e of exams){const days=Math.max(1,Math.ceil((new Date(e.date+'T00:00:00')-today)/86400000));const topics=e.topics.split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);out+='<h3>'+audiEscape(e.subject)+' — '+audiEscape(e.date)+'</h3>';for(let i=0;i<Math.min(days,14);i++){const day=new Date(today);day.setDate(day.getDate()+i);const topic=topics[i%Math.max(1,topics.length)]||'Revisão geral';out+='<div class="lesson">'+day.toLocaleDateString('pt-BR')+' · '+mins+' minutos · '+audiEscape(i===days-1?'Revisão final e exercícios':topic)+'</div>'}}el.innerHTML=out;
}
function audiGetManagerContext(){
 const d=audiData();return d.exams.slice(-12).map(e=>e.subject+' em '+e.date+': '+e.topics).join('\n');
}
